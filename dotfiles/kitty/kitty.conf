include themes/noctalia.conf

font_family Adwaita Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.5
symbol_map U+1F000-U+1FAFF Noto Color Emoji
symbol_map U+2600-U+27BF Noto Color Emoji

window_padding_width 12 14 12 14

background_opacity 0.72
dynamic_background_opacity yes

cursor_shape beam
cursor_beam_thickness 1.6
cursor_blink_interval 0.55
cursor #c8b6ff
cursor_text_color #11121d

confirm_os_window_close 0
